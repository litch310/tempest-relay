name: Keep the relay awake

# Render's free plan puts the relay to sleep after 15 minutes without players.
# This visits it every 10 minutes so it stays awake.
on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visit the relay
        run: |
          for attempt in 1 2 3; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://tempest-relay.onrender.com/ || true)
            echo "Attempt $attempt: HTTP $status"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 20
          done
          echo "The relay did not answer with 200 after 3 tries."
          exit 1
